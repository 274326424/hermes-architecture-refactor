<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" style="background:#0f172a;font-family:monospace">
  <defs>
    <marker id="arrow-r" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-l" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" fill="#34d399"/>
    </marker>
  </defs>

  <text x="350" y="35" fill="#e2e8f0" font-size="18" font-weight="bold" text-anchor="middle">AI Collaboration Model</text>

  <!-- ===== Left: Hermes Agent ===== -->
  <rect x="30" y="60" width="280" height="310" rx="10" fill="rgba(6,78,59,0.15)" stroke="#34d399" stroke-width="2"/>
  <text x="170" y="88" fill="#34d399" font-size="14" font-weight="bold" text-anchor="middle">Hermes Agent (Architect)</text>
  <text x="170" y="105" fill="#6ee7b7" font-size="10" text-anchor="middle">DeepSeek V4 Flash · Persistent Memory</text>

  <rect x="55" y="120" width="230" height="30" rx="5" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1"/>
  <text x="170" y="140" fill="#e2e8f0" font-size="11" text-anchor="middle">📖 Read all existing code files</text>

  <rect x="55" y="160" width="230" height="30" rx="5" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1"/>
  <text x="170" y="180" fill="#e2e8f0" font-size="11" text-anchor="middle">🔍 Diagnose architecture issues</text>

  <rect x="55" y="200" width="230" height="30" rx="5" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1"/>
  <text x="170" y="220" fill="#e2e8f0" font-size="11" text-anchor="middle">🧠 Theory &amp; solution design</text>

  <rect x="55" y="240" width="230" height="30" rx="5" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1"/>
  <text x="170" y="260" fill="#e2e8f0" font-size="11" text-anchor="middle">📋 Review &amp; revise the plan</text>

  <rect x="55" y="280" width="230" height="30" rx="5" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1"/>
  <text x="170" y="300" fill="#e2e8f0" font-size="11" text-anchor="middle">✅ Write review checklist + tests</text>

  <rect x="55" y="320" width="230" height="30" rx="5" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1"/>
  <text x="170" y="340" fill="#e2e8f0" font-size="11" text-anchor="middle">🚀 Deploy &amp; verify production</text>

  <!-- Bidirectional arrows -->
  <line x1="310" y1="200" x2="390" y2="200" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-r)"/>
  <line x1="390" y1="220" x2="310" y2="220" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-l)"/>
  <text x="350" y="190" fill="#fbbf24" font-size="10" text-anchor="middle">Plan →</text>
  <text x="350" y="235" fill="#fbbf24" font-size="10" text-anchor="middle">← Feedback</text>

  <!-- ===== Right: Coding Agent ===== -->
  <rect x="390" y="60" width="280" height="310" rx="10" fill="rgba(8,51,68,0.15)" stroke="#22d3ee" stroke-width="2"/>
  <text x="530" y="88" fill="#22d3ee" font-size="14" font-weight="bold" text-anchor="middle">Coding Agent (Implementer)</text>
  <text x="530" y="105" fill="#67e8f9" font-size="10" text-anchor="middle">Code Implementation · Detailed Review</text>

  <rect x="415" y="120" width="230" height="30" rx="5" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="530" y="140" fill="#e2e8f0" font-size="11" text-anchor="middle">💻 Write code per the plan</text>

  <rect x="415" y="160" width="230" height="30" rx="5" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="530" y="180" fill="#e2e8f0" font-size="11" text-anchor="middle">🔧 Syntax check &amp; bulk replace</text>

  <rect x="415" y="200" width="230" height="30" rx="5" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="530" y="220" fill="#e2e8f0" font-size="11" text-anchor="middle">🔎 Review code line by line</text>

  <rect x="415" y="240" width="230" height="30" rx="5" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="530" y="260" fill="#e2e8f0" font-size="11" text-anchor="middle">🧪 Run tests</text>

  <rect x="415" y="280" width="230" height="30" rx="5" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="530" y="300" fill="#e2e8f0" font-size="11" text-anchor="middle">📝 Output review report</text>

  <rect x="415" y="320" width="230" height="30" rx="5" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="530" y="340" fill="#e2e8f0" font-size="11" text-anchor="middle">📊 Zero syntax errors</text>

  <!-- Bottom message -->
  <rect x="100" y="385" width="500" height="30" rx="6" fill="rgba(30,41,59,0.4)" stroke="#94a3b8" stroke-width="1"/>
  <text x="350" y="405" fill="#94a3b8" font-size="10" text-anchor="middle">Each plays to their strengths: Hermes handles architecture + the coding agent handles execution → complete engineering loop</text>
</svg>