<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 620" style="background:#0f172a;font-family:monospace">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#34d399"/>
    </marker>
  </defs>

  <text x="300" y="35" fill="#e2e8f0" font-size="18" font-weight="bold" text-anchor="middle">unified_analyze() Pipeline</text>
  <text x="300" y="55" fill="#64748b" font-size="11" text-anchor="middle">10 Sequential Steps · Independent · Unified Output</text>

  <!-- Steps -->
  <g transform="translate(0,0)">
    <!-- Step 0 -->
    <rect x="200" y="75" width="200" height="36" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
    <text x="300" y="98" fill="#fb7185" font-size="12" font-weight="bold" text-anchor="middle">⓪ Contract Validation</text>
    <line x1="300" y1="111" x2="300" y2="125" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Step 1 -->
    <rect x="200" y="125" width="200" height="36" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="300" y="148" fill="#34d399" font-size="12" font-weight="bold" text-anchor="middle">① Data Standardization</text>
    <line x1="300" y1="161" x2="300" y2="175" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Step 2 -->
    <rect x="200" y="175" width="200" height="36" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="300" y="198" fill="#22d3ee" font-size="12" font-weight="bold" text-anchor="middle">② Core Calc A</text>
    <line x1="300" y1="211" x2="300" y2="225" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Step 3 -->
    <rect x="200" y="225" width="200" height="36" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="300" y="248" fill="#22d3ee" font-size="12" font-weight="bold" text-anchor="middle">③ Core Calc B</text>
    <line x1="300" y1="261" x2="300" y2="275" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Step 4 -->
    <rect x="130" y="275" width="140" height="36" rx="6" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1"/>
    <text x="200" y="298" fill="#fb923c" font-size="11" font-weight="bold" text-anchor="middle">④ Auxiliary 1</text>
    <line x1="270" y1="293" x2="290" y2="293" stroke="#334155" stroke-width="1.5"/>

    <!-- Step 5 -->
    <rect x="330" y="275" width="140" height="36" rx="6" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1"/>
    <text x="400" y="298" fill="#fb923c" font-size="11" font-weight="bold" text-anchor="middle">⑤ Auxiliary 2</text>

    <!-- Join -->
    <line x1="200" y1="311" x2="200" y2="325" stroke="#334155" stroke-width="1.5"/>
    <line x1="400" y1="311" x2="400" y2="325" stroke="#334155" stroke-width="1.5"/>
    <line x1="200" y1="325" x2="400" y2="325" stroke="#334155" stroke-width="1"/>
    <line x1="300" y1="325" x2="300" y2="335" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Step 6 -->
    <rect x="200" y="335" width="200" height="36" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="300" y="358" fill="#22d3ee" font-size="12" font-weight="bold" text-anchor="middle">⑥ Core Calc C</text>
    <line x1="300" y1="371" x2="300" y2="385" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Step 7 -->
    <rect x="200" y="385" width="200" height="36" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="300" y="408" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">⑦ Label Generation</text>
    <line x1="300" y1="421" x2="300" y2="435" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Step 8 -->
    <rect x="200" y="435" width="200" height="36" rx="6" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
    <text x="300" y="458" fill="#fb923c" font-size="12" font-weight="bold" text-anchor="middle">⑧ Weighted Fusion (Gated)</text>
    <line x1="300" y1="471" x2="300" y2="485" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Step 9 -->
    <rect x="200" y="485" width="200" height="36" rx="6" fill="rgba(76,29,149,0.5)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="300" y="508" fill="#a78bfa" font-size="12" font-weight="bold" text-anchor="middle">⑨ Return Structured Result</text>

    <!-- Output -->
    <line x1="300" y1="521" x2="300" y2="540" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="220" y="540" width="160" height="32" rx="8" fill="rgba(76,29,149,0.3)" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="300" y="560" fill="#a78bfa" font-size="11" text-anchor="middle">StockAnalysis Object</text>
  </g>

  <!-- Right annotations -->
  <text x="440" y="98" fill="#64748b" font-size="9">require_kline()</text>
  <text x="440" y="148" fill="#64748b" font-size="9">standardize_kline()</text>
  <text x="440" y="198" fill="#64748b" font-size="9">compute_all_factors()</text>
  <text x="440" y="248" fill="#64748b" font-size="9">detect_main_trend()</text>
  <text x="440" y="298" fill="#64748b" font-size="9">candlestick / oscillator</text>
  <text x="440" y="358" fill="#64748b" font-size="9">chaos_resonance()</text>
  <text x="440" y="408" fill="#64748b" font-size="9">compute_trend_label()</text>
  <text x="440" y="458" fill="#64748b" font-size="9">Volume Ratio&lt;2→Cap70% Momentum&lt;3→Cap60%</text>
  <text x="440" y="508" fill="#64748b" font-size="9">to_legacy_dict() backwards compatibility</text>
</svg>