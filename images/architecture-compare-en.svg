<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" style="background:#0f172a;font-family:monospace">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#34d399"/>
    </marker>
    <marker id="arrow-violet" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#a78bfa"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="35" fill="#e2e8f0" font-size="18" font-weight="bold" text-anchor="middle">Architecture Comparison: Before → After</text>

  <!-- == Left: Before == -->
  <text x="200" y="65" fill="#f87171" font-size="14" font-weight="bold" text-anchor="middle">Before — Three Independent Pipelines</text>

  <!-- Pipeline A -->
  <rect x="60" y="85" width="280" height="36" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="200" y="108" fill="#22d3ee" font-size="12" text-anchor="middle">Pipeline A (Scheduler)</text>

  <rect x="60" y="135" width="280" height="36" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="200" y="158" fill="#34d399" font-size="11" text-anchor="middle">Fetch → Calc A → Calc B → Merge → Output</text>

  <!-- Pipeline B -->
  <rect x="60" y="195" width="280" height="36" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="200" y="218" fill="#22d3ee" font-size="12" text-anchor="middle">Pipeline B (Dashboard)</text>

  <rect x="60" y="245" width="280" height="36" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="200" y="268" fill="#34d399" font-size="11" text-anchor="middle">Fetch → Calc A → Calc B → Merge → Output</text>

  <!-- Pipeline C -->
  <rect x="60" y="305" width="280" height="36" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="200" y="328" fill="#22d3ee" font-size="12" text-anchor="middle">Pipeline C (Scheduled Tasks)</text>

  <rect x="60" y="355" width="280" height="36" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="200" y="378" fill="#34d399" font-size="11" text-anchor="middle">Fetch → Calc A → Calc B → Merge → Output</text>

  <!-- Warning -->
  <text x="200" y="415" fill="#fb7185" font-size="10" text-anchor="middle">⚠ 40%+ Code Duplication | Separate Import Chains | Inconsistent Interfaces</text>

  <!-- Arrow -->
  <line x1="345" y1="220" x2="455" y2="220" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="210" fill="#fbbf24" font-size="11" text-anchor="middle">Refactor</text>

  <!-- == Right: After == -->
  <text x="600" y="65" fill="#34d399" font-size="14" font-weight="bold" text-anchor="middle">After — Unified Entry Point</text>

  <!-- Three layers pointing to unified entry -->
  <rect x="460" y="95" width="280" height="32" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="600" y="115" fill="#22d3ee" font-size="12" text-anchor="middle">Scheduler</text>

  <rect x="460" y="145" width="280" height="32" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="600" y="165" fill="#22d3ee" font-size="12" text-anchor="middle">Dashboard</text>

  <rect x="460" y="195" width="280" height="32" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="600" y="215" fill="#22d3ee" font-size="12" text-anchor="middle">Scheduled Tasks</text>

  <!-- Down arrow -->
  <line x1="600" y1="227" x2="600" y2="255" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- unified_analyze -->
  <rect x="480" y="255" width="240" height="50" rx="8" fill="rgba(6,78,59,0.6)" stroke="#34d399" stroke-width="2"/>
  <text x="600" y="278" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle">unified_analyze()</text>
  <text x="600" y="294" fill="#6ee7b7" font-size="9" text-anchor="middle">Single Entry · 10-Step Pipeline · Contract Checks</text>

  <!-- Down arrow -->
  <line x1="600" y1="305" x2="600" y2="335" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>

  <!-- StockAnalysis -->
  <rect x="490" y="335" width="220" height="40" rx="8" fill="rgba(76,29,149,0.5)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="600" y="355" fill="#a78bfa" font-size="12" font-weight="bold" text-anchor="middle">StockAnalysis</text>
  <text x="600" y="369" fill="#ddd6fe" font-size="9" text-anchor="middle">Structured Output · 17 Fields Fully Compatible</text>

  <!-- Thin Wrapper -->
  <rect x="490" y="390" width="220" height="30" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="600" y="409" fill="#94a3b8" font-size="10" text-anchor="middle">Thin Wrapper → Legacy Interface Compatibility</text>

  <!-- Results -->
  <rect x="490" y="440" width="220" height="55" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1"/>
  <text x="600" y="458" fill="#fbbf24" font-size="10" text-anchor="middle">✅ Single Entry | ✅ Zero Hardcoding</text>
  <text x="600" y="475" fill="#fbbf24" font-size="10" text-anchor="middle">✅ Contract Checks | ✅ Output Compatible</text>

  <!-- Legend -->
  <text x="50" y="470" fill="#64748b" font-size="9">Legend: ■ Frontend/Caller ■ Compute Layer ■ Data Layer ■ Compatibility Layer</text>
</svg>